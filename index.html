<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sreenath P, Senior Backend Engineer. Experience, skills, awards and contact.">
<title>Sreenath P</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single reading column with a left "log rail" — career rendered like a service's release history, newest first */
:root{
  --bg:#EDF0EE; --surface:#F8FAF9; --fg:#14201D; --muted:#58665F; --line:#C9D2CD;
  --accent:#1F5BD6; --accent-soft:#DCE5FA; --signal:#0E8A5F;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#161D1A; --fg:#E4EBE7; --muted:#93A39B; --line:#2A3631;
  --accent:#7FA2F5; --accent-soft:#1C2742; --signal:#4FD39E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#161D1A; --fg:#E4EBE7; --muted:#93A39B; --line:#2A3631;
  --accent:#7FA2F5; --accent-soft:#1C2742; --signal:#4FD39E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 17px/1.6 var(--body);padding-inline:20px;padding-block:0 64px}
.wrap{max-width:760px;margin:0 auto}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.label{font:500 12px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* hero */
header{padding-block:72px 40px;display:grid;gap:20px}
.status{display:inline-flex;align-items:center;gap:10px;font:500 13px/1.4 var(--mono);color:var(--muted);flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 4px color-mix(in srgb,var(--signal) 22%,transparent)}
h1{font-size:clamp(48px,11vw,96px);font-weight:800;line-height:.95;letter-spacing:-.035em}
.role{font:600 clamp(20px,3.6vw,26px)/1.3 var(--display);color:var(--accent)}
.lede{font-size:19px;max-width:62ch;margin:0}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:8px;font:500 14px/1 var(--mono);padding:11px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);text-decoration:none;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}

/* figures */
.figs{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);margin-block:8px 56px}
.fig{padding:18px 12px 18px 0}
.fig+.fig{padding-left:16px;border-left:1px solid var(--line)}
.fig b{display:block;font:700 34px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fig span{font:400 13px/1.35 var(--mono);color:var(--muted)}
@media (max-width:620px){.figs{grid-template-columns:repeat(2,1fr)}.fig:nth-child(3){padding-left:0;border-left:0}.fig:nth-child(n+3){border-top:1px solid var(--line)}}

section{margin-bottom:64px}
section>h2{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-bottom:24px;display:flex;align-items:baseline;gap:14px}
section>h2 .label{font-size:11px}

/* log rail */
.log{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.entry{position:relative;padding:0 0 40px 28px}
.entry:last-child{padding-bottom:0}
.entry::before{content:"";position:absolute;left:-7px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--muted)}
.entry.current::before{background:var(--signal);border-color:var(--signal)}
.when{font:500 13px/1.4 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.dur{color:var(--fg)}
.entry.current .dur{color:var(--signal)}
.entry h3{font-size:23px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.org{font:500 15px/1.4 var(--mono);color:var(--accent);margin-top:2px}
.about{font-style:italic;color:var(--muted);margin:10px 0 0;max-width:62ch}
.entry ul{margin:12px 0 0;padding-left:18px;max-width:64ch}
.entry li{margin-bottom:6px}
.entry li::marker{color:var(--accent)}
.sub{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}
.sub h4{font:700 18px/1.3 var(--display);margin:2px 0 0}
.tag{display:inline-block;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-left:8px;vertical-align:middle}

/* skills */
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 32px}
@media (max-width:620px){.skills{grid-template-columns:1fr}}
.skills h3{font:500 12px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{font:400 14px/1 var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

/* awards + edu */
.rows{display:grid;gap:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.row .when{padding-top:3px}
.row strong{font:700 18px/1.3 var(--display)}
.row div span{display:block;color:var(--muted);font-size:15px}
@media (max-width:480px){.row{grid-template-columns:1fr;gap:2px}}

footer{border-top:1px solid var(--line);padding-top:28px;display:grid;gap:14px}
footer p{margin:0;max-width:60ch}
.toast{font:500 13px var(--mono);color:var(--signal);min-height:1.2em}
@media (prefers-reduced-motion:no-preference){.chip{transition:border-color .15s}}

.work{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.work a{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--mono);padding:9px 12px;border-radius:6px;background:var(--accent-soft);color:var(--accent);text-decoration:none}
.work a:hover{text-decoration:underline}
.domains{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.domain{padding:16px 20px 16px 0;border-bottom:1px solid var(--line);min-width:0}
.domain:nth-child(even){padding-left:20px;border-left:1px solid var(--line)}
.domain-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.domain strong{font:700 18px/1.3 var(--display)}
.domain .where{font:500 12px/1.4 var(--mono);color:var(--accent);white-space:nowrap}
.domain p{margin:4px 0 0;color:var(--muted);font-size:15px;line-height:1.5}
@media (max-width:620px){.domains{grid-template-columns:1fr}.domain:nth-child(even){padding-left:0;border-left:0}}
.state{padding-block:120px;color:var(--muted);font:500 14px/1.6 var(--mono)}
.state.err{color:var(--fg)}
.state code{background:var(--surface);border:1px solid var(--line);padding:2px 6px;border-radius:4px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body>
<div class="wrap" id="app"><p class="state">Loading profile…</p></div>

<script>
/* All content comes from profile.yaml. Durations are computed from today's date. */
(function(){
  var app=document.getElementById("app");
  var now=new Date(), nowM=now.getFullYear()*12+now.getMonth();
  var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function ym(s){var a=String(s).split("-");return (+a[0])*12+(+a[1]-1)}
  function label(s){var a=String(s).split("-");return MON[+a[1]-1]+" "+a[0]}
  function span(m){var y=Math.floor(m/12),r=m%12,o=[];if(y)o.push(y+(y==1?" yr":" yrs"));if(r)o.push(r+(r==1?" mo":" mos"));return o.join(" ")||"1 mo"}
  function months(start,end){return Math.max((end?ym(end):nowM)-ym(start),1)}
  function range(start,end){return label(start)+" — "+(end?label(end):"Present")}
  function when(start,end){return '<div class="when">'+esc(range(start,end))+'<span class="dur"> · '+span(months(start,end))+'</span></div>'}
  function links(ls){return ls&&ls.length?'<div class="work">'+ls.filter(function(l){return /^https?:\/\//.test(l.url||"")}).map(function(l){return '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label||l.url)+' ↗</a>'}).join("")+'</div>':""}
  function list(points){return points&&points.length?"<ul>"+points.map(function(p){return"<li>"+esc(p)+"</li>"}).join("")+"</ul>":""}

  function render(d){
    var exp=d.experience||[], roles=[];
    exp.forEach(function(c){(c.roles||[]).forEach(function(r){roles.push(r)})});
    var first=Math.min.apply(null,roles.map(function(r){return ym(r.start)}));
    var hasCurrent=roles.some(function(r){return !r.end});
    var last=hasCurrent?nowM:Math.max.apply(null,roles.map(function(r){return ym(r.end)}));
    var totalM=Math.max(last-first,1), years=Math.floor(totalM/12);
    var c=d.contact||{};
    var emailBtn=function(id){return c.email?'<button class="chip primary" id="'+id+'" type="button">'+esc(c.email)+'</button>':""};

    var h='<header>'
      +'<div class="status"><span class="dot" aria-hidden="true"></span>'+esc([d.location,d.headline_status].filter(Boolean).join(" · "))+'</div>'
      +'<h1>'+esc(d.name)+'</h1>'
      +'<div class="role">'+esc(d.title)+' · '+years+'+ years</div>'
      +(d.summary?'<p class="lede">'+esc(d.summary)+'</p>':"")
      +'<div class="links">'+emailBtn("copy-email")
      +(c.links||[]).map(function(l){return '<a class="chip" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>'}).join("")
      +'</div><div class="toast" id="toast" aria-live="polite"></div></header>';

    var figs=[{value:(totalM/12).toFixed(1),label:"years of experience"}].concat(d.highlights||[]);
    h+='<div class="figs">'+figs.map(function(f){return '<div class="fig"><b>'+esc(f.value)+'</b><span>'+esc(f.label)+'</span></div>'}).join("")+'</div>';

    h+='<section id="experience"><h2>Experience <span class="label">newest first</span></h2><ol class="log">';
    exp.forEach(function(co){
      var rs=co.roles||[], current=rs.some(function(r){return !r.end});
      var org=[co.company,co.product,co.location].filter(Boolean).join(" · ");
      h+='<li class="entry'+(current?" current":"")+'">';
      if(rs.length===1){
        var r=rs[0];
        h+=when(r.start,r.end)+'<h3>'+esc(r.title)+'</h3><div class="org">'+esc(org)+'</div>'
          +(co.about?'<p class="about">'+esc(co.about)+'</p>':"")+list(r.points)+links((co.links||[]).concat(r.links||[]));
      }else{
        var s=rs.reduce(function(a,r){return ym(r.start)<ym(a)?r.start:a},rs[0].start);
        var e=current?null:rs.reduce(function(a,r){return ym(r.end)>ym(a)?r.end:a},rs[0].end);
        h+=when(s,e)+'<h3>'+esc(co.company)+' <span class="tag">'+rs.length+' roles</span></h3>'
          +'<div class="org">'+esc([co.product,co.location].filter(Boolean).join(" · "))+'</div>'
          +(co.about?'<p class="about">'+esc(co.about)+'</p>':"")+links(co.links)
          +rs.map(function(r){return '<div class="sub">'+when(r.start,r.end)+'<h4>'+esc(r.title)+'</h4>'+list(r.points)+links(r.links)+'</div>'}).join("");
      }
      h+='</li>';
    });
    h+='</ol></section>';

    if(d.domains&&d.domains.length){
      h+='<section id="domains"><h2>Domains</h2><div class="domains">'
        +d.domains.map(function(x){return '<div class="domain"><div class="domain-head"><strong>'+esc(x.name)+'</strong>'+(x.where?'<span class="where">'+esc(x.where)+'</span>':"")+'</div>'+(x.note?'<p>'+esc(x.note)+'</p>':"")+'</div>'}).join("")
        +'</div></section>';
    }
    if(d.skills){
      h+='<section id="skills"><h2>Skills</h2><div class="skills">'
        +Object.keys(d.skills).map(function(k){return '<div><h3>'+esc(k)+'</h3><div class="pills">'+(d.skills[k]||[]).map(function(s){return"<span>"+esc(s)+"</span>"}).join("")+'</div></div>'}).join("")
        +'</div></section>';
    }
    if(d.awards&&d.awards.length){
      h+='<section id="awards"><h2>Awards</h2><div class="rows">'
        +d.awards.map(function(a){return '<div class="row"><div class="when">'+esc(label(a.date))+'</div><div><strong>'+esc(a.title)+'</strong><span>'+esc(a.org)+'</span></div></div>'}).join("")
        +'</div></section>';
    }
    if(d.education&&d.education.length){
      h+='<section id="education"><h2>Education</h2><div class="rows">'
        +d.education.map(function(e){return '<div class="row"><div class="when">'+esc(e.years)+'</div><div><strong>'+esc(e.degree)+'</strong><span>'+esc(e.school)+'</span></div></div>'}).join("")
        +'</div></section>';
    }
    h+='<footer><span class="label">Get in touch</span>'+(d.footer_note?'<p>'+esc(d.footer_note)+'</p>':"")
      +'<div class="links">'+emailBtn("copy-email-2")+'</div></footer>';

    app.innerHTML=h;
    if(d.name) document.title=d.name;
    wireCopy(c.email);
  }

  function wireCopy(email){
    var toast=document.getElementById("toast");
    function done(m){toast.textContent=m;clearTimeout(done.t);done.t=setTimeout(function(){toast.textContent=""},2500)}
    function sel(b){var r=document.createRange();r.selectNodeContents(b);var s=getSelection();s.removeAllRanges();s.addRange(r);done("Email selected, press Ctrl+C to copy")}
    ["copy-email","copy-email-2"].forEach(function(id){
      var b=document.getElementById(id); if(!b) return;
      b.addEventListener("click",function(){
        try{navigator.clipboard.writeText(email).then(function(){done("Email copied")},function(){sel(b)})}catch(e){sel(b)}
      });
    });
  }

  function fail(msg){
    app.innerHTML='<p class="state err">The page could not load <code>profile.yaml</code>.<br>'+esc(msg)+'</p>';
  }

  fetch("profile.yaml",{cache:"no-cache"})
    .then(function(r){if(!r.ok) throw new Error("File not found (HTTP "+r.status+"). Keep profile.yaml next to index.html."); return r.text()})
    .then(function(t){
      var d;
      try{d=jsyaml.load(t)}catch(e){throw new Error("There is a formatting mistake in profile.yaml: "+e.message)}
      render(d);
    })
    .catch(function(e){fail(e.message)});
})();
</script>
</body>
</html>
